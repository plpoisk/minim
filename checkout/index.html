<!DOCTYPE html>
<html lang="uk">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
 background:#f5f5f5;
}

.container{
 max-width:390px;
 margin:auto;
 padding-bottom:180px;
}

.header{
 padding:16px;
 font-weight:700;
 font-size:20px;
 background:white;
}

.card{
 background:white;
 margin:12px;
 padding:16px;
 border-radius:16px;
}

.item{
 display:flex;
 gap:12px;
 align-items:flex-start;
 margin-bottom:12px;
}

.checkbox{
 width:22px;
 height:22px;
 cursor:pointer;
}

.price-old{
 text-decoration:line-through;
 color:#aaa;
 font-size:14px;
}

.price-new{
 font-weight:700;
 font-size:18px;
}

.child{
 margin-left:34px;
 font-size:14px;
 color:#666;
 margin-top:6px;
}

.summary-box{
 background:white;
 margin:12px;
 padding:16px;
 border-radius:16px;
}

.summary-row{
 display:flex;
 justify-content:space-between;
 margin-bottom:6px;
}

.fixed{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 max-width:390px;
 margin:auto;
 background:white;
 border-top:1px solid #eee;
 padding:16px;
}

.cta{
 background:#8DB36B;
 color:white;
 text-align:center;
 padding:14px;
 border-radius:12px;
 font-weight:600;
}

</style>
</head>

<body>

<div class="container">

<div class="header">КОШИК</div>

<div class="card">

<div class="item">
<input type="checkbox" class="checkbox" checked onchange="toggleItem(0)">
<div>
<div><b>Сережки</b></div>
<div class="price-old">1 540 грн</div>
<div class="price-new">1 060 грн</div>
</div>
</div>

<div class="child">
Базове пакування — 1 грн
</div>

</div>

<div class="card">

<div class="item">
<input type="checkbox" class="checkbox" checked onchange="toggleItem(1)">
<div>
<div><b>Каблучка</b></div>
<div class="price-old">19 950 грн</div>
<div class="price-new">13 150 грн</div>
</div>
</div>

<div class="child">
Гравіювання — 350 грн
</div>

<div class="child">
Преміум пакування — 0 грн
</div>

</div>

<div class="summary-box">
<div class="summary-row">
<div>Сума без знижки</div>
<div id="sumOld">21 490 грн</div>
</div>

<div class="summary-row">
<div>Знижка</div>
<div id="discount">6 890 грн</div>
</div>

<div class="summary-row">
<div>Доставка</div>
<div id="delivery">80 грн</div>
</div>

<hr>

<div class="summary-row">
<b>До сплати</b>
<b id="total">14 230 грн</b>
</div>

</div>

</div>

<div class="fixed">
<div class="summary-row">
<div class="price-old">21 490 грн</div>
<div><b id="bottomTotal">14 230 грн</b></div>
</div>
<div class="cta">ДО ОФОРМЛЕННЯ</div>
</div>

<script>

const items = [
 {
  old:1540,
  new:1060,
  children:1
 },
 {
  old:19950,
  new:13150,
  children:350
 }
]

let selected = [true,true]

function format(n){
 return n.toLocaleString('uk-UA')
}

function toggleItem(i){
 selected[i] = !selected[i]
 recalc()
}

function recalc(){

 let sumOld = 0
 let sumNew = 0

 items.forEach((item,i)=>{
  if(selected[i]){
   sumOld += item.old
   sumNew += item.new + item.children
  }
 })

 let discount = sumOld - sumNew
 let delivery = sumNew > 0 ? 80 : 0
 let total = sumNew + delivery

 document.getElementById('sumOld').innerText = format(sumOld)+' грн'
 document.getElementById('discount').innerText = format(discount)+' грн'
 document.getElementById('delivery').innerText = format(delivery)+' грн'
 document.getElementById('total').innerText = format(total)+' грн'
 document.getElementById('bottomTotal').innerText = format(total)+' грн'

}

recalc()

</script>

</body>
</html>
