<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart Prototype</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="header">КОШИК</div>

<!-- ITEM 1 -->

<div class="card">

<div class="item">
<input type="checkbox" checked onchange="toggleItem(0)">
<div>
<b>Сережки</b>
<div class="price-old">1 540 грн</div>
<div class="price-new">1 060 грн</div>
</div>
</div>

<div class="child">Базове пакування — 1 грн</div>

</div>

<!-- ITEM 2 -->

<div class="card">

<div class="item">
<input type="checkbox" checked onchange="toggleItem(1)">
<div>
<b>Каблучка</b>
<div class="price-old">19 950 грн</div>
<div class="price-new">13 150 грн</div>
</div>
</div>

<div class="child">Гравіювання — 350 грн</div>
<div class="child">Преміум пакування — 0 грн</div>

</div>

<!-- SUMMARY -->

<div class="summary-box">

<div class="summary-row">
<span>Сума без знижки</span>
<span id="sumOld"></span>
</div>

<div class="summary-row">
<span>Знижка</span>
<span id="discount"></span>
</div>

<div class="summary-row">
<span>Доставка</span>
<span id="delivery"></span>
</div>https://github.com/plpoisk/minim/tree/main/checkout

<hr>

<div class="summary-row">
<b>До сплати</b>
<b id="total"></b>
</div>

</div>

</div>

<!-- FIXED CTA -->

<div class="fixed">

<div class="summary-row">
<span class="price-old" id="bottomOld"></span>
<b id="bottomTotal"></b>
</div>

<div class="cta">ДО ОФОРМЛЕННЯ</div>

</div>

<script src="script.js"></script>

</body>
</html>
