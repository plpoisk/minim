<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
}

.container{
 max-width:390px;
 margin:auto;
 padding-bottom:140px;
}

.header{
 padding:16px;
 font-weight:600;
 border-bottom:1px solid #eee;
}

.product{
 padding:16px;
 border-bottom:1px solid #eee;
}

.edit{
 margin-top:8px;
 color:#777;
 cursor:pointer;
}

.qty{
 margin-top:10px;
}

.qty button{
 width:30px;
 height:30px;
}

.summary{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 max-width:390px;
 margin:auto;
 background:white;
 border-top:1px solid #eee;
 padding:16px;
}

.cta{
 background:black;
 color:white;
 padding:14px;
 text-align:center;
}

.sheet{
 position:fixed;
 bottom:-100%;
 left:0;
 right:0;
 max-width:390px;
 margin:auto;
 background:white;
 padding:20px;
 transition:0.3s;
 border-radius:16px 16px 0 0;
}

.sheet.active{
 bottom:0;
}

.option{
 padding:12px 0;
 border-bottom:1px solid #eee;
 cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="header">Кошик</div>

<div class="product">

<b>Кільце Minimal</b>

<div class="edit" onclick="openSheet('size')">
Розмір: <span id="sizeLabel">17</span>
</div>

<div class="edit" onclick="openSheet('engrave')">
<span id="engraveLabel">Додати гравіювання</span>
</div>

<div class="edit" onclick="openSheet('pack')">
<span id="packLabel">Стандартне пакування</span>
</div>

<div class="qty">
<button onclick="changeQty(-1)">-</button>
<span id="qty">1</span>
<button onclick="changeQty(1)">+</button>
</div>

</div>

</div>

<div class="summary">
<div>До сплати: <span id="total">1540</span> грн</div>
<div class="cta">Оформити</div>
</div>

<!-- SIZE -->

<div class="sheet" id="size">
<h3>Розмір</h3>
<div class="option" onclick="setSize(16)">16</div>
<div class="option" onclick="setSize(17)">17</div>
<div class="option" onclick="setSize(18)">18</div>
</div>

<!-- ENGRAVE -->

<div class="sheet" id="engrave">
<h3>Гравіювання</h3>
<input id="engraveInput">
<button onclick="applyEngrave()">OK</button>
</div>

<!-- PACK -->

<div class="sheet" id="pack">
<h3>Пакування</h3>
<div class="option" onclick="setPack('Стандартне',0)">Стандартне</div>
<div class="option" onclick="setPack('Преміум +350',350)">Преміум</div>
</div>

<script>

let qty=1
let basePrice=1540
let packPrice=0

function recalc(){
 document.getElementById('total').innerText=(basePrice+packPrice)*qty
}

function changeQty(v){
 qty+=v
 if(qty<1)qty=1
 document.getElementById('qty').innerText=qty
 recalc()
}

function openSheet(id){
 document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('active'))
 document.getElementById(id).classList.add('active')
}

function setSize(s){
 document.getElementById('sizeLabel').innerText=s
 closeSheets()
}

function applyEngrave(){
 let val=document.getElementById('engraveInput').value
 if(val){
 document.getElementById('engraveLabel').innerText='Гравіювання: '+val
 }
 closeSheets()
}

function setPack(name,price){
 packPrice=price
 document.getElementById('packLabel').innerText=name
 recalc()
 closeSheets()
}

function closeSheets(){
 document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('active'))
}

</script>

</body>
</html>
